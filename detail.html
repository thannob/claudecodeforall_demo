<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดเมนู 🍽️</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a017;
    --red: #c0392b;
    --green: #27632a;
    --cream: #fff8ec;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Kanit', sans-serif;
    background: linear-gradient(180deg, var(--cream), #ffe9c7);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    color: #3a2a1a;
  }
  .back-link { align-self: flex-start; max-width: 420px; width: 100%; margin: 0 auto 16px; color: var(--red); text-decoration: none; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }
  .card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    padding: 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    border: 3px solid var(--gold);
  }
  .emoji { font-size: 96px; }
  .dish-name { font-size: 28px; font-weight: 700; color: var(--red); margin: 8px 0 4px; }
  .category { display: inline-block; background: var(--green); color: white; font-size: 13px; padding: 2px 12px; border-radius: 12px; margin-bottom: 12px; }
  .desc { color: #55432c; margin-bottom: 24px; }
  .ingredients { text-align: left; }
  .ingredients h2 { color: var(--red); font-size: 18px; margin-bottom: 12px; }
  .ingredients ul { margin: 0; padding-left: 20px; }
  .ingredients li { margin-bottom: 6px; }
  .empty { text-align: center; color: #a08a6f; }
</style>
</head>
<body>
  <a class="back-link" href="index.html">← กลับหน้าหลัก</a>
  <div class="card" id="card">
    <p class="empty">ไม่พบเมนูนี้</p>
  </div>

<script src="dishes.js"></script>
<script>
function dishVisual(dish, size) {
  return dish.image
    ? `<img src="${dish.image}" alt="${dish.name}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:12px;">`
    : dish.emoji;
}

const params = new URLSearchParams(location.search);
const dish = DISHES.find(d => d.name === params.get("dish"));
const card = document.getElementById("card");

if (dish) {
  card.innerHTML = `
    <div class="emoji">${dishVisual(dish, 96)}</div>
    <div class="dish-name">${dish.name}</div>
    <div class="category">${dish.category}</div>
    <p class="desc">${dish.desc}</p>
    <div class="ingredients">
      <h2>ส่วนประกอบ</h2>
      <ul>${dish.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>
  `;
}
</script>
</body>
</html>
