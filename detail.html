<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดเมนู 🍽️</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-deep-forest: #00473c;
    --color-sage-mist: #d8e5d6;
    --color-cream-canvas: #f4f3e7;
    --color-forest-shadow: #0e150e;
    --color-warm-gray: #8c8c82;

    --font-display: 'Kanit', sans-serif;
    --font-text: 'Kanit', sans-serif;

    --radius-cards: 24px;
    --radius-images: 20px;
    --radius-badges: 20px;

    --shadow-xl: rgba(14, 21, 14, 0.4) 3px 3px 32px -10px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-text);
    background: var(--color-cream-canvas);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    color: var(--color-forest-shadow);
  }
  .ghost-link {
    font-weight: 700;
    font-size: 16px;
    color: var(--color-forest-shadow);
    text-decoration: none;
  }
  .ghost-link:hover { text-decoration: underline; }
  .back-link { align-self: flex-start; max-width: 480px; width: 100%; margin: 0 auto 24px; }

  .detail-card {
    background: #ffffff;
    border-radius: var(--radius-cards);
    box-shadow: var(--shadow-xl);
    padding: 32px 24px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .d-visual {
    width: 160px;
    height: 160px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 88px;
    background: var(--color-sage-mist);
    border-radius: var(--radius-images);
    overflow: hidden;
  }
  .d-category {
    display: inline-block;
    background: var(--color-sage-mist);
    color: var(--color-deep-forest);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: var(--radius-badges);
    margin-bottom: 12px;
  }
  .d-name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 32px;
    line-height: 1;
    margin: 0 0 12px;
  }
  .d-desc { font-size: 16px; line-height: 1.25; margin: 0 0 24px; }
  .ingredients { text-align: left; }
  .eyebrow {
    display: block;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--color-deep-forest);
    margin: 0 0 12px;
  }
  .ingredients ul { margin: 0; padding-left: 20px; }
  .ingredients li { margin-bottom: 8px; font-size: 16px; line-height: 1.25; }
  .empty { text-align: center; color: var(--color-warm-gray); }
</style>
</head>
<body>
  <a class="ghost-link back-link" href="index.html">← กลับหน้าหลัก</a>
  <div class="detail-card" id="card">
    <p class="empty">ไม่พบเมนูนี้</p>
  </div>

<script src="dishes.js"></script>
<script>
function dishVisual(dish, size) {
  const dim = size === "100%" ? "100%" : `${size}px`;
  return dish.image
    ? `<img src="${dish.image}" alt="${dish.name}" style="width:${dim};height:${dim};object-fit:cover;">`
    : dish.emoji;
}

const params = new URLSearchParams(location.search);
const dish = DISHES.find(d => d.name === params.get("dish"));
const card = document.getElementById("card");

if (dish) {
  card.innerHTML = `
    <div class="d-visual">${dishVisual(dish, "100%")}</div>
    <div class="d-category">${dish.category}</div>
    <div class="d-name">${dish.name}</div>
    <p class="d-desc">${dish.desc}</p>
    <div class="ingredients">
      <span class="eyebrow">ส่วนประกอบ</span>
      <ul>${dish.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>
  `;
}
</script>
</body>
</html>
